device:
  name: SteelSeries Arctis Nova Elite
  vendor_id: 0x1038
  product_ids:
    - 0x2244
  command_padding:
    length: 64
    position: end
    filler: 0x00

  command_interface_index: [0, 3]
  listen_interface_indexes: [3, 4]

  device_init:
    - [0x06, 0x20]
    - [0x06, 0x10]
    - ['status.request']

  status:
    request: 0x06b0
    response_mapping:
      - starts_with: 0xb0
        headset_battery_charge: 8
        mic_status: 9
        headset_power_status: 15

      - starts_with: [7, 37]
        station_volume: 2

      - starts_with: [7, 69]
        media_mix: 2
        chat_mix: 3

    representation:
      headset:
        - headset_power_status
        - headset_battery_charge
      mic:
        - mic_status
      mixer:
        - media_mix
        - chat_mix
      gamedac:
        - station_volume
  
  online_status:
    status_variable: headset_power_status
    online_value: online

  settings:
    microphone:
      mic_volume:
        type: slider
        min: 0x01
        max: 0x0a
        step: 1
        min_label: mic_muted
        max_label: perc_100
        default: 0x0a
        update_sequence: [0x06, 0x37, 'value']

  status_parse:
    station_volume:
      type: percentage
      perc_min: 0
      perc_max: 56 # Verified: raw 0 = muted, raw 56 = max volume
    media_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    chat_mix:
      type: percentage
      perc_min: 0
      perc_max: 100
    headset_battery_charge:
      type: percentage
      perc_min: 0
      perc_max: 8 # Verified: 8 is 100%
    mic_status:
      type: int_str_mapping
      values:
        0x01: muted
        0x00: unmuted
    headset_power_status:
      type: int_str_mapping
      values:
        0x01: offline
        0x02: cable_charging
        0x08: online
